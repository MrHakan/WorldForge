name: v5.0 Warfare Lifecycle Hardening

on:
  push:
    branches: [v5.0-warfare-lifecycle-hardening, v5.0-simulation-hook-registry, v5.0-legacy-wrapper-cleanup, main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax check
        run: |
          node --check warfare-hooks.js
          node --check warfare-lifecycle.js
          node --check warfare-occupation-policy.js
          node --check warfare-strategic-ai-ui.js
          node --check warfare-strategic-map-overlay.js
          node --check warfare-occupation-policy-ui.js
          node --check warfare-campaign-planning-ui.js
          node --check warfare-strategic-reserves-ui.js
          node --check warfare-excavation-projects.js
          node --check warfare-relic-journeys.js
          node --check warfare-national-memory.js
          node --check worldbuilding-loader.js
          node --check tests/warfare-hook-registry.test.js
          node --check tests/warfare-legacy-wrapper-source.test.js
          node --check tests/warfare-lifecycle-hardening.test.js
          node --check tests/warfare-excavation-projects.test.js
          node --check tests/warfare-relic-journeys.test.js
          node --check tests/warfare-national-memory.test.js
      - name: Hook registry behavior
        run: node tests/warfare-hook-registry.test.js
      - name: Legacy wrapper source cleanup
        run: node tests/warfare-legacy-wrapper-source.test.js
      - name: Behavioral hardening checks
        run: node tests/warfare-lifecycle-hardening.test.js
      - name: Excavation project behavior
        run: node tests/warfare-excavation-projects.test.js
      - name: Relic journey behavior
        run: node tests/warfare-relic-journeys.test.js
      - name: National memory behavior
        run: node tests/warfare-national-memory.test.js
      - name: Lifecycle contract
        run: |
          node - <<'NODE'
          const fs=require('fs'),read=p=>fs.readFileSync(p,'utf8');
          const hooks=read('warfare-hooks.js'),life=read('warfare-lifecycle.js'),loader=read('worldbuilding-loader.js'),occ=read('warfare-occupation-policy.js'),exc=read('warfare-excavation-projects.js'),journey=read('warfare-relic-journeys.js'),memory=read('warfare-national-memory.js');
          const presentation=['warfare-strategic-ai-ui.js','warfare-strategic-map-overlay.js','warfare-occupation-policy-ui.js','warfare-campaign-planning-ui.js','warfare-strategic-reserves-ui.js'].map(read);
          for(const token of ["VERSION='5.0.22'",'capturedInitialize','capturedSimulate','registerHook','registerKnownHooks','runAnnual','lastSimulatedYear','warfareHookDispatches']) if(!hooks.includes(token)) throw Error(`hooks:${token}`);
          for(const token of ['mobilization','pathfinding','naval','diplomacy-war-state','postwar-recovery','war-goals-peace','strategic-ai','commanders','strategic-reserves','theater-command','campaign-planning','occupation-policy','national-memory']) if(!hooks.includes(token)) throw Error(`hook-order:${token}`);
          for(const token of ["VERSION='5.0.15'",'lastAdvancedYear','advanceCount','Hooks?.runAnnual','Hooks?.activate']) if(!life.includes(token)) throw Error(`lifecycle:${token}`);
          if(life.includes('simulateWarfareYear=function')) throw Error('lifecycle must not wrap simulateWarfareYear');
          for(const token of ['warfare-hooks.js','warfare-theater-command.js','warfare-excavation-projects.js','warfare-relic-journeys.js','warfare-national-memory.js','warfare-lifecycle.js','WorldForgeWarfareHooks.activate()']) if(!loader.includes(token)) throw Error(`loader:${token}`);
          for(const token of ["VERSION='5.0.4'",'lastAppliedYear','yearsOccupied']) if(!occ.includes(token)) throw Error(token);
          for(const token of ["VERSION='5.0.12'",'survey','excavation','conservation','publication','museum']) if(!exc.includes(token)) throw Error(token);
          for(const token of ["VERSION='5.0.13'",'ownershipHistory','wartime-transfer','restitution']) if(!journey.includes(token)) throw Error(token);
          for(const token of ["VERSION='5.0.14'",'great-victory','national-tragedy','contested-memory','diplomaticGrievance','winnerSide']) if(!memory.includes(token)) throw Error(token);
          for(const src of presentation) for(const forbidden of ['applyStrategicAI?.(','applyCommanders?.(','applyStrategicReserves?.(','applyCampaignPlanning?.(','applyOccupationPolicy?.(','applyTheaterCommand?.(']) if(src.includes(forbidden)) throw Error(`presentation mutation: ${forbidden}`);
          console.log('warfare hook registry + lifecycle + theater command contracts OK');
          NODE
