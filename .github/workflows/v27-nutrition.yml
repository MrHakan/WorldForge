name: Validate WorldForge v2.7 Food & Humanitarian Relief

on:
  push:
    branches: ["main"]
    paths:
      - "src/features/emergency/**"
      - "src/features/nutrition/**"
      - "tests/features/emergency.mjs"
      - "tests/features/nutrition.mjs"
      - ".github/workflows/v27-nutrition.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/features/emergency/**"
      - "src/features/nutrition/**"
      - "tests/features/emergency.mjs"
      - "tests/features/nutrition.mjs"
      - ".github/workflows/v27-nutrition.yml"

permissions:
  contents: read

concurrency:
  group: v27-nutrition-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-v27:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check v2.6 and v2.7 JavaScript syntax
        run: |
          node --check src/features/emergency/emergency-engine.js
          node --check src/features/emergency/emergency-loader.js
          node --check src/features/emergency/emergency-ui.js
          node --check src/features/nutrition/nutrition-engine.js
          node --check src/features/nutrition/nutrition-wiki-adapter.js
          node --check src/features/nutrition/nutrition-loader.js
          node --check src/features/nutrition/nutrition-ui.js
          node --check tests/features/emergency.mjs
          node --check tests/features/nutrition.mjs
      - name: Validate v2.7 runtime files and optimization hooks
        run: |
          test -f src/features/nutrition/nutrition-engine.js
          test -f src/features/nutrition/nutrition-wiki-adapter.js
          test -f src/features/nutrition/nutrition-loader.js
          test -f src/features/nutrition/nutrition-ui.js
          test -f src/features/nutrition/nutrition.css
          grep -q "WorldForgeNutrition" src/features/nutrition/nutrition-engine.js
          grep -q "famine_crisis" src/features/nutrition/nutrition-wiki-adapter.js
          grep -q "relief_operation" src/features/nutrition/nutrition-wiki-adapter.js
          grep -q "src/features/nutrition/nutrition-loader.js" src/features/emergency/emergency-loader.js
          grep -q "new WeakMap" src/features/nutrition/nutrition-engine.js
          grep -q "requestAnimationFrame" src/features/nutrition/nutrition-ui.js
          grep -q "lastAppliedYear" src/features/nutrition/nutrition-engine.js
          grep -q "__nutritionBridge" src/features/nutrition/nutrition-engine.js
          grep -q "takeFood" src/features/nutrition/nutrition-engine.js
          grep -q "refugeeCampPopulation" src/features/nutrition/nutrition-engine.js
      - name: Run v2.6 emergency regression
        run: node tests/features/emergency.mjs
      - name: Run v2.7 food nutrition famine and humanitarian regression
        run: node tests/features/nutrition.mjs
