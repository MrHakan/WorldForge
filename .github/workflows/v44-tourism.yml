name: Validate WorldForge v4.4 Tourism, Pilgrimage & Cultural Economy

on:
  push:
    branches: ["main", "v4.4-tourism-pilgrimage-cultural-economy"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate-v44:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check v4.4 JavaScript syntax
        run: |
          node --check src/features/tourism/tourism-engine.js
          node --check src/features/tourism/tourism-pixel-renderer.js
          node --check src/features/tourism/tourism-wiki-adapter.js
          node --check src/features/tourism/tourism-ui.js
          node --check src/features/worldbuilding/worldbuilding-loader.js
          node --check tests/features/tourism-v44.mjs
      - name: Validate v4.4 tourism hooks
        run: |
          grep -q "pilgrimage_route" src/features/tourism/tourism-engine.js
          grep -q "overtourism" src/features/tourism/tourism-engine.js
          grep -q "conservationShare" src/features/tourism/tourism-engine.js
          grep -q "data-worldforge-tourism" src/features/tourism/tourism-pixel-renderer.js
          grep -q "tourism_destination" src/features/tourism/tourism-wiki-adapter.js
          grep -q "TOURISM, PILGRIMAGE & CULTURAL ECONOMY" src/features/tourism/tourism-ui.js
          grep -q "src/features/tourism/tourism-engine.js" src/features/worldbuilding/worldbuilding-loader.js
      - name: Run v4.0 worldbuilding compatibility regression
        run: node tests/features/worldbuilding.mjs
      - name: Run v4.1 historical landscape regression
        run: node tests/features/worldbuilding-v41.mjs
      - name: Run v4.1.1 pixel diversity regression
        run: node tests/features/pixel-art-polish.mjs
      - name: Run v4.2 archaeology regression
        run: node tests/features/archaeology-v42.mjs
      - name: Run v4.3 heritage regression
        run: node tests/features/heritage-v43.mjs
      - name: Run v4.4 tourism regression
        run: node tests/features/tourism-v44.mjs
