name: Validate WorldForge v4.2 Living Ruins & Archaeology

on:
  push:
    branches: ["main", "v4.2-living-ruins-archaeology"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate-v42:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check v4.2 JavaScript syntax
        run: |
          node --check src/features/archaeology/archaeology-engine.js
          node --check src/features/archaeology/archaeology-pixel-renderer.js
          node --check src/features/archaeology/archaeology-wiki-adapter.js
          node --check src/features/archaeology/archaeology-ui.js
          node --check src/features/worldbuilding/worldbuilding-loader.js
          node --check tests/features/archaeology-v42.mjs
      - name: Validate v4.2 archaeology hooks
        run: |
          grep -q "pristine.*damaged.*ruined.*overgrown.*excavated" src/features/archaeology/archaeology-engine.js
          grep -q "historicalLayers" src/features/archaeology/archaeology-engine.js
          grep -q "artifact" src/features/archaeology/archaeology-engine.js
          grep -q "inscription" src/features/archaeology/archaeology-engine.js
          grep -q "data-ruin-stage" src/features/archaeology/archaeology-pixel-renderer.js
          grep -q "renderReconstruction" src/features/archaeology/archaeology-pixel-renderer.js
          grep -q "renderLifecycleStrip" src/features/archaeology/archaeology-pixel-renderer.js
          grep -q "archaeological_site" src/features/archaeology/archaeology-wiki-adapter.js
          grep -q "historical_reconstruction" src/features/archaeology/archaeology-wiki-adapter.js
          grep -q "ARCHAEOLOGY & HISTORICAL LAYERS" src/features/archaeology/archaeology-ui.js
          grep -q "src/features/archaeology/archaeology-engine.js" src/features/worldbuilding/worldbuilding-loader.js
      - name: Run v4.0 worldbuilding compatibility regression
        run: node tests/features/worldbuilding.mjs
      - name: Run v4.1 historical landscape regression
        run: node tests/features/worldbuilding-v41.mjs
      - name: Run v4.1.1 pixel diversity regression
        run: node tests/features/pixel-art-polish.mjs
      - name: Run v4.2 archaeology regression
        run: node tests/features/archaeology-v42.mjs
