name: Validate WorldForge v2.9 Diplomacy & International Relations

on:
  push:
    branches: ["main"]
    paths:
      - "src/features/politics/**"
      - "src/features/diplomacy/**"
      - "tests/features/politics.mjs"
      - "tests/features/diplomacy.mjs"
      - ".github/workflows/v29-diplomacy.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/features/politics/**"
      - "src/features/diplomacy/**"
      - "tests/features/politics.mjs"
      - "tests/features/diplomacy.mjs"
      - ".github/workflows/v29-diplomacy.yml"

permissions:
  contents: read

concurrency:
  group: v29-diplomacy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-v29:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check v2.8 and v2.9 JavaScript syntax
        run: |
          node --check src/features/politics/politics-engine.js
          node --check src/features/politics/politics-loader.js
          node --check src/features/politics/politics-ui.js
          node --check src/features/diplomacy/diplomacy-engine.js
          node --check src/features/diplomacy/diplomacy-wiki-adapter.js
          node --check src/features/diplomacy/diplomacy-loader.js
          node --check src/features/diplomacy/diplomacy-ui.js
          node --check tests/features/politics.mjs
          node --check tests/features/diplomacy.mjs
      - name: Validate v2.9 runtime files and optimization hooks
        run: |
          test -f src/features/diplomacy/diplomacy-engine.js
          test -f src/features/diplomacy/diplomacy-wiki-adapter.js
          test -f src/features/diplomacy/diplomacy-loader.js
          test -f src/features/diplomacy/diplomacy-ui.js
          test -f src/features/diplomacy/diplomacy.css
          grep -q "WorldForgeDiplomacy" src/features/diplomacy/diplomacy-engine.js
          grep -q "diplomatic_relation" src/features/diplomacy/diplomacy-wiki-adapter.js
          grep -q "realm_diplomacy" src/features/diplomacy/diplomacy-wiki-adapter.js
          grep -q "src/features/diplomacy/diplomacy-loader.js" src/features/politics/politics-loader.js
          grep -q "new WeakMap" src/features/diplomacy/diplomacy-engine.js
          grep -q "requestAnimationFrame" src/features/diplomacy/diplomacy-ui.js
          grep -q "lastAppliedYear" src/features/diplomacy/diplomacy-engine.js
          grep -q "__diplomacyBridge" src/features/diplomacy/diplomacy-engine.js
          grep -q "TREATY_TYPES" src/features/diplomacy/diplomacy-engine.js
          grep -q "trade_agreement" src/features/diplomacy/diplomacy-engine.js
          grep -q "humanitarian_aid" src/features/diplomacy/diplomacy-engine.js
          grep -q "warRisk" src/features/diplomacy/diplomacy-engine.js
      - name: Run v2.8 politics regression
        run: node tests/features/politics.mjs
      - name: Run v2.9 diplomacy regression
        run: node tests/features/diplomacy.mjs
