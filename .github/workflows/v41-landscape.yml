name: Validate WorldForge v4.1 Historical Landscape & Architecture

on:
  push:
    branches: ["main", "v4.1-historical-landscape-architecture", "v4.1.1-pixel-diversity-polish"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate-v41:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check v4.1 JavaScript syntax
        run: |
          node --check src/rendering/structure-archetypes.js
          node --check src/rendering/pixel-structure-renderer.js
          node --check src/rendering/pixel-art-polish.js
          node --check src/features/worldbuilding/worldbuilding-engine.js
          node --check src/features/worldbuilding/worldbuilding-wiki-adapter.js
          node --check src/features/worldbuilding/worldbuilding-loader.js
          node --check src/features/worldbuilding/worldbuilding-ui.js
          node --check tests/features/worldbuilding-v41.mjs
          node --check tests/features/pixel-art-polish.mjs
      - name: Validate v4.1 architecture and landscape hooks
        run: |
          grep -q "ARCHITECTURE_FAMILIES" src/rendering/structure-archetypes.js
          grep -q "CULTURE_VARIANTS" src/rendering/structure-archetypes.js
          grep -q "data-worldforge-renderer=\"v4.1\"" src/rendering/pixel-structure-renderer.js
          grep -q "data-architecture-family" src/rendering/pixel-structure-renderer.js
          grep -q "landmarkGlyph" src/rendering/pixel-structure-renderer.js
          grep -q "data-worldforge-polish" src/rendering/pixel-art-polish.js
          grep -q "gable_house" src/rendering/pixel-art-polish.js
          grep -q "stockade_barracks" src/rendering/pixel-art-polish.js
          grep -q "caravan_house" src/rendering/pixel-art-polish.js
          grep -q "historicalLandmarks" src/features/worldbuilding/worldbuilding-engine.js
          grep -q "maxLandmarks" src/features/worldbuilding/worldbuilding-engine.js
          grep -q "indexedHistoricalSites" src/features/worldbuilding/worldbuilding-engine.js
          grep -q "indexedGreatWorks" src/features/worldbuilding/worldbuilding-engine.js
          grep -q "historical_landmark" src/features/worldbuilding/worldbuilding-wiki-adapter.js
          grep -q "architecture_style" src/features/worldbuilding/worldbuilding-wiki-adapter.js
          grep -q "HISTORICAL LANDSCAPE" src/features/worldbuilding/worldbuilding-ui.js
          grep -q "requestAnimationFrame" src/features/worldbuilding/worldbuilding-ui.js
      - name: Run institution and Great Work regression
        run: node tests/features/institutions.mjs
      - name: Run v3.0 world-order regression
        run: node tests/features/world-order.mjs
      - name: Run v4.0 worldbuilding compatibility regression
        run: node tests/features/worldbuilding.mjs
      - name: Run v4.1 historical landscape regression
        run: node tests/features/worldbuilding-v41.mjs
      - name: Run v4.1.1 pixel-art diversity regression
        run: node tests/features/pixel-art-polish.mjs
