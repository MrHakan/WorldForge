name: Validate WorldForge v4.3 Heritage Museums & Relics

on:
  push:
    branches: ["main", "v4.3-heritage-museums-relics"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate-v43:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check v4.3 JavaScript syntax
        run: |
          node --check src/features/heritage/heritage-engine.js
          node --check src/features/heritage/heritage-pixel-renderer.js
          node --check src/features/heritage/heritage-wiki-adapter.js
          node --check src/features/heritage/heritage-ui.js
          node --check src/features/worldbuilding/worldbuilding-loader.js
          node --check tests/features/heritage-v43.mjs
      - name: Validate v4.3 heritage hooks
        run: |
          grep -q "world_heritage" src/features/heritage/heritage-engine.js
          grep -q "restitution" src/features/heritage/heritage-engine.js
          grep -q "wartime_removal" src/features/heritage/heritage-engine.js
          grep -q "rescue_operation" src/features/heritage/heritage-engine.js
          grep -q "data-heritage-overlay" src/features/heritage/heritage-pixel-renderer.js
          grep -q "data-worldforge-relic-card" src/features/heritage/heritage-pixel-renderer.js
          grep -q "heritage_site" src/features/heritage/heritage-wiki-adapter.js
          grep -q "restitution_claim" src/features/heritage/heritage-wiki-adapter.js
          grep -q "HERITAGE, MUSEUMS & RELICS" src/features/heritage/heritage-ui.js
          grep -q "src/features/heritage/heritage-engine.js" src/features/worldbuilding/worldbuilding-loader.js
      - name: Run v4.0 worldbuilding compatibility regression
        run: node tests/features/worldbuilding.mjs
      - name: Run v4.1 historical landscape regression
        run: node tests/features/worldbuilding-v41.mjs
      - name: Run v4.1.1 pixel diversity regression
        run: node tests/features/pixel-art-polish.mjs
      - name: Run v4.2 archaeology compatibility regression
        run: node tests/features/archaeology-v42.mjs
      - name: Run v4.3 heritage regression
        run: node tests/features/heritage-v43.mjs
