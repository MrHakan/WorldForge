name: Repository structure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/reorganize-repository-structure]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate repository layout
        run: node tests/core/repository-structure.mjs
      - name: Validate native metric charts
        run: |
          node --check src/rendering/metric-charts.js
          node tests/core/metric-charts.test.js
