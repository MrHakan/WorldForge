name: v4.9 Warfare Supply

on:
  push:
    branches: [main, v4.9-warfare-supply-lines]
    paths:
      - 'warfare-supply-engine.js'
      - 'warfare-mobilization.js'
      - 'warfare-pathfinding.js'
      - 'warfare-supply-ui.js'
      - 'warfare-supply-overlay.js'
      - 'workspace-navigation.js'
      - 'worldbuilding-loader.js'
      - 'V4.9.md'
      - '.github/workflows/v49-warfare-supply.yml'
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check warfare-supply-engine.js
          node --check warfare-mobilization.js
          node --check warfare-pathfinding.js
          node --check warfare-supply-ui.js
          node --check warfare-supply-overlay.js
          node --check workspace-navigation.js
          node --check worldbuilding-loader.js
      - name: Contract smoke test
        run: |
          node <<'NODE'
          const fs=require('fs');
          const engine=fs.readFileSync('warfare-supply-engine.js','utf8');
          const mobilization=fs.readFileSync('warfare-mobilization.js','utf8');
          const pathfinding=fs.readFileSync('warfare-pathfinding.js','utf8');
          const ui=fs.readFileSync('warfare-supply-ui.js','utf8');
          const overlay=fs.readFileSync('warfare-supply-overlay.js','utf8');
          const loader=fs.readFileSync('worldbuilding-loader.js','utf8');
          for(const token of ["VERSION='4.9.3'",'foodReserve','ammoReserve','equipment','morale','experience','combatPower','marchProgress','marchCost','supplyLines','fortification','manpower','casualties','resolveRelief','fleetFor','simulateWarfareYear']) if(!engine.includes(token)) throw new Error(`Missing engine token: ${token}`);
          for(const token of ["VERSION='4.9.4'",'Peacetime Levy','Limited Mobilization','General Mobilization','Emergency Levy','activatedManpower','mobilizationLaw','reinforcementPriority','realmView']) if(!mobilization.includes(token)) throw new Error(`Missing mobilization token: ${token}`);
          for(const token of ["VERSION='4.9.4'",'buildGraph','shortestPath','pointAlong','roadQuality','terrainPenalty','routePoints','PATHFINDING_VERSION']) if(!pathfinding.includes(token)) throw new Error(`Missing pathfinding token: ${token}`);
          for(const token of ['WARFARE & SUPPLY LINES','FOOD RESERVE','AMMUNITION','EQUIPMENT','MORALE','EXPERIENCE','COMBAT POWER','MANPOWER','CASUALTIES','RELIEF BATTLES','FLEETS']) if(!ui.includes(token)) throw new Error(`Missing UI token: ${token}`);
          for(const token of ['worldforgeSupplyOverlay','data-supply-status','data-army-state','data-fleet-status','data-route-nodes','data-route-quality']) if(!overlay.includes(token)) throw new Error(`Missing overlay token: ${token}`);
          for(const token of ['warfare-supply-engine.js','warfare-mobilization.js','warfare-pathfinding.js','warfare-supply-ui.js','warfare-supply-overlay.js','simulateWarfareYear']) if(!loader.includes(token)) throw new Error(`Missing loader token: ${token}`);
          console.log('v4.9 warfare supply contract OK');
          NODE
