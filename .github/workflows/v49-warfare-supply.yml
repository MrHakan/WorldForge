name: v4.9 Warfare Supply

on:
  push:
    branches: [main, v4.9-warfare-supply-lines, v4.9-army-map-interactions, v4.9-postwar-consequences, v4.9-war-goals-peace-terms]
    paths:
      - 'warfare-supply-engine.js'
      - 'warfare-mobilization.js'
      - 'warfare-pathfinding.js'
      - 'warfare-naval.js'
      - 'warfare-diplomacy.js'
      - 'warfare-postwar.js'
      - 'warfare-peace.js'
      - 'warfare-supply-ui.js'
      - 'warfare-postwar-ui.js'
      - 'warfare-peace-ui.js'
      - 'warfare-supply-overlay.js'
      - 'workspace-navigation.js'
      - 'worldbuilding-loader.js'
      - 'V4.9.md'
      - '.github/workflows/v49-warfare-supply.yml'
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check warfare-supply-engine.js
          node --check warfare-mobilization.js
          node --check warfare-pathfinding.js
          node --check warfare-naval.js
          node --check warfare-diplomacy.js
          node --check warfare-postwar.js
          node --check warfare-peace.js
          node --check warfare-supply-ui.js
          node --check warfare-postwar-ui.js
          node --check warfare-peace-ui.js
          node --check warfare-supply-overlay.js
          node --check workspace-navigation.js
          node --check worldbuilding-loader.js
      - name: Contract smoke test
        run: |
          node <<'NODE'
          const fs=require('fs');
          const engine=fs.readFileSync('warfare-supply-engine.js','utf8');
          const mobilization=fs.readFileSync('warfare-mobilization.js','utf8');
          const pathfinding=fs.readFileSync('warfare-pathfinding.js','utf8');
          const naval=fs.readFileSync('warfare-naval.js','utf8');
          const diplomacy=fs.readFileSync('warfare-diplomacy.js','utf8');
          const postwar=fs.readFileSync('warfare-postwar.js','utf8');
          const peace=fs.readFileSync('warfare-peace.js','utf8');
          const ui=fs.readFileSync('warfare-supply-ui.js','utf8');
          const postwarUi=fs.readFileSync('warfare-postwar-ui.js','utf8');
          const peaceUi=fs.readFileSync('warfare-peace-ui.js','utf8');
          const overlay=fs.readFileSync('warfare-supply-overlay.js','utf8');
          const loader=fs.readFileSync('worldbuilding-loader.js','utf8');
          for(const token of ["VERSION='4.9.3'",'foodReserve','ammoReserve','equipment','morale','experience','combatPower','marchProgress','marchCost','supplyLines','fortification','manpower','casualties','resolveRelief','fleetFor','simulateWarfareYear']) if(!engine.includes(token)) throw new Error(`Missing engine token: ${token}`);
          for(const token of ["VERSION='4.9.4'",'Peacetime Levy','Limited Mobilization','General Mobilization','Emergency Levy','activatedManpower','mobilizationLaw','reinforcementPriority','realmView']) if(!mobilization.includes(token)) throw new Error(`Missing mobilization token: ${token}`);
          for(const token of ["VERSION='4.9.4'",'buildGraph','shortestPath','pointAlong','roadQuality','terrainPenalty','routePoints','PATHFINDING_VERSION']) if(!pathfinding.includes(token)) throw new Error(`Missing pathfinding token: ${token}`);
          for(const token of ["VERSION='4.9.5'",'assignMission','nearestHostileFleet','naval-interception','resolveBattles','movementProgress','activeInterceptions','seaControl','NAVAL_VERSION']) if(!naval.includes(token)) throw new Error(`Missing naval token: ${token}`);
          for(const token of ["VERSION='4.9.6'",'warPairs','atWar','nearestWarTarget','demobilizeArmy','retargetArmy','sanitizeNaval','activeWars','DIPLOMACY_WAR_VERSION']) if(!diplomacy.includes(token)) throw new Error(`Missing diplomacy integration token: ${token}`);
          for(const token of ["VERSION='4.9.7'",'endedWars','displacedThisYear','refugeeCampPopulation','reconstructionPressure','returnedManpower','applyPostWarRecovery','POSTWAR_VERSION']) if(!postwar.includes(token)) throw new Error(`Missing post-war token: ${token}`);
          for(const token of ["VERSION='4.9.8'",'GOALS','goalFor','warScore','termsFor','peace_treaty','reparations','borderAdjustment','applyWarGoalsAndPeace','PEACE_VERSION']) if(!peace.includes(token)) throw new Error(`Missing peace token: ${token}`);
          for(const token of ['WARFARE & SUPPLY LINES','ARMY INSPECTOR','SELECTED ARMY','Focus Home','Focus Target','selectedArmyId','focusCity','FOOD RESERVE','AMMUNITION','EQUIPMENT','MORALE','EXPERIENCE','COMBAT POWER','MANPOWER','CASUALTIES','RELIEF BATTLES','FLEETS','NAVAL BATTLES','INTERCEPTIONS']) if(!ui.includes(token)) throw new Error(`Missing UI token: ${token}`);
          for(const token of ['POST-WAR RECOVERY','DEMOBILIZATION','DISPLACEMENT','REFUGEES','RECONSTRUCTION','MANPOWER RETURNED']) if(!postwarUi.includes(token)) throw new Error(`Missing post-war UI token: ${token}`);
          for(const token of ['WAR GOALS & PEACE TERMS','WAR SCORE','PEACE SETTLEMENT','REPARATIONS','BORDER ADJUSTMENT']) if(!peaceUi.includes(token)) throw new Error(`Missing peace UI token: ${token}`);
          for(const token of ['worldforgeSupplyOverlay','data-supply-status','data-army-id','data-selected','data-army-state','data-fleet-status','data-route-nodes','data-route-quality','data-fleet-mission','data-naval-battle','selectArmy']) if(!overlay.includes(token)) throw new Error(`Missing overlay token: ${token}`);
          for(const token of ['warfare-supply-engine.js','warfare-mobilization.js','warfare-pathfinding.js','warfare-naval.js','warfare-diplomacy.js','warfare-postwar.js','warfare-peace.js','warfare-supply-ui.js','warfare-postwar-ui.js','warfare-peace-ui.js','warfare-supply-overlay.js','simulateWarfareYear']) if(!loader.includes(token)) throw new Error(`Missing loader token: ${token}`);
          console.log('v4.9 warfare supply contract OK');
          NODE
