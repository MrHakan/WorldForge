name: Validate WorldForge v2.8 Politics & Unrest

on:
  push:
    branches: ["main", "v2.8-politics-unrest"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate-v28:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check v2.7 and v2.8 JavaScript syntax
        run: |
          node --check src/features/nutrition/nutrition-engine.js
          node --check src/features/nutrition/nutrition-loader.js
          node --check src/features/nutrition/nutrition-ui.js
          node --check src/features/politics/politics-engine.js
          node --check src/features/politics/politics-wiki-adapter.js
          node --check src/features/politics/politics-loader.js
          node --check src/features/politics/politics-ui.js
          node --check tests/features/nutrition.mjs
          node --check tests/features/politics.mjs
      - name: Validate v2.8 runtime files and optimization hooks
        run: |
          test -f src/features/politics/politics-engine.js
          test -f src/features/politics/politics-wiki-adapter.js
          test -f src/features/politics/politics-loader.js
          test -f src/features/politics/politics-ui.js
          test -f src/features/politics/politics.css
          grep -q "WorldForgePolitics" src/features/politics/politics-engine.js
          grep -q "realm_politics" src/features/politics/politics-wiki-adapter.js
          grep -q "civil_unrest" src/features/politics/politics-wiki-adapter.js
          grep -q "src/features/politics/politics-loader.js" src/features/nutrition/nutrition-loader.js
          grep -q "new WeakMap" src/features/politics/politics-engine.js
          grep -q "requestAnimationFrame" src/features/politics/politics-ui.js
          grep -q "lastAppliedYear" src/features/politics/politics-engine.js
          grep -q "__politicsBridge" src/features/politics/politics-engine.js
          grep -q "coupRisk" src/features/politics/politics-engine.js
          grep -q "revolutionRisk" src/features/politics/politics-engine.js
          grep -q "BLOC_KEYS" src/features/politics/politics-engine.js
      - name: Run v2.7 nutrition regression
        run: node tests/features/nutrition.mjs
      - name: Run v2.8 politics unrest regression
        run: node tests/features/politics.mjs
