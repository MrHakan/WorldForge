name: Strategic Map Stale Pins
on:
  push:
    branches: [main, fix-strategic-pinned-intel-stale-targets]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check src/features/warfare/warfare-strategic-map-controls.js
          node --check tests/warfare/warfare-strategic-map-stale-pins.test.js
      - name: Stale pinned intel behavior
        run: node tests/warfare/warfare-strategic-map-stale-pins.test.js
