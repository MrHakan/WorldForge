name: Performance regression smoke
on:
  push:
    branches: [perf/full-audit-optimization]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic performance smoke
        run: node tests/performance.mjs
