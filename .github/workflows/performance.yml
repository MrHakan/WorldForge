name: Performance regression smoke
on:
  push:
    branches: [perf/full-audit-optimization]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check optimized runtime
        run: |
          node --check app.js
          node --check renderer.js
          node --check engine.js
          node --check history-engine.js
          node --check society-engine.js
          node --check wiki-engine.js
          node --check release-integration.js
          node --check tests/performance.mjs
      - name: Run deterministic performance smoke
        run: node tests/performance.mjs
