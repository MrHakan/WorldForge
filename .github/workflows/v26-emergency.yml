name: Validate WorldForge v2.6 Emergency Response

on:
  push:
    branches: ["main"]
    paths:
      - "src/features/municipal/**"
      - "src/features/emergency/**"
      - "tests/features/municipal.mjs"
      - "tests/features/emergency.mjs"
      - ".github/workflows/v26-emergency.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/features/municipal/**"
      - "src/features/emergency/**"
      - "tests/features/municipal.mjs"
      - "tests/features/emergency.mjs"
      - ".github/workflows/v26-emergency.yml"

permissions:
  contents: read

concurrency:
  group: v26-emergency-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-v26:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check v2.5 and v2.6 JavaScript syntax
        run: |
          node --check src/features/municipal/municipal-engine.js
          node --check src/features/municipal/municipal-loader.js
          node --check src/features/municipal/municipal-ui.js
          node --check src/features/emergency/emergency-engine.js
          node --check src/features/emergency/emergency-wiki-adapter.js
          node --check src/features/emergency/emergency-loader.js
          node --check src/features/emergency/emergency-ui.js
          node --check tests/features/municipal.mjs
          node --check tests/features/emergency.mjs
      - name: Validate v2.6 runtime files and optimization hooks
        run: |
          test -f src/features/emergency/emergency-engine.js
          test -f src/features/emergency/emergency-wiki-adapter.js
          test -f src/features/emergency/emergency-loader.js
          test -f src/features/emergency/emergency-ui.js
          test -f src/features/emergency/emergency.css
          grep -q "WorldForgeEmergency" src/features/emergency/emergency-engine.js
          grep -q "River Fever" src/features/emergency/emergency-engine.js
          grep -q "disease_outbreak" src/features/emergency/emergency-wiki-adapter.js
          grep -q "urban_fire" src/features/emergency/emergency-wiki-adapter.js
          grep -q "src/features/emergency/emergency-loader.js" src/features/municipal/municipal-loader.js
          grep -q "new WeakMap" src/features/emergency/emergency-engine.js
          grep -q "requestAnimationFrame" src/features/emergency/emergency-ui.js
          grep -q "lastAppliedYear" src/features/emergency/emergency-engine.js
          grep -q "__emergencyBridge" src/features/emergency/emergency-engine.js
      - name: Run v2.5 municipal regression
        run: node tests/features/municipal.mjs
      - name: Run v2.6 health disease fire and emergency regression
        run: node tests/features/emergency.mjs
