name: v4.8 Economy Logistics

on:
  push:
    branches: [main, v4.8-economy-logistics]
    paths:
      - 'economy-logistics-engine.js'
      - 'economy-logistics-ui.js'
      - 'trade-route-overlay.js'
      - 'workspace-navigation.js'
      - 'worldbuilding-loader.js'
      - 'V4.8.md'
      - '.github/workflows/v48-economy-logistics.yml'
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check economy-logistics-engine.js
          node --check economy-logistics-ui.js
          node --check trade-route-overlay.js
          node --check workspace-navigation.js
          node --check worldbuilding-loader.js
      - name: Contract smoke test
        run: |
          node <<'NODE'
          const fs=require('fs');
          const engine=fs.readFileSync('economy-logistics-engine.js','utf8');
          const ui=fs.readFileSync('economy-logistics-ui.js','utf8');
          const overlay=fs.readFileSync('trade-route-overlay.js','utf8');
          const loader=fs.readFileSync('worldbuilding-loader.js','utf8');
          for(const token of ["VERSION='4.8.0'",'pricePressure','warehouse','dock','caravan','routeView']) if(!engine.includes(token)) throw new Error(`Missing engine token: ${token}`);
          for(const token of ['REGIONAL ECONOMY & LOGISTICS','PRICE PRESSURE','economyRouteList']) if(!ui.includes(token)) throw new Error(`Missing UI token: ${token}`);
          for(const token of ['worldforgeTradeOverlay','data-route-mode','data-good']) if(!overlay.includes(token)) throw new Error(`Missing overlay token: ${token}`);
          for(const token of ['economy-logistics-engine.js','economy-logistics-ui.js','trade-route-overlay.js','simulateEconomyYear']) if(!loader.includes(token)) throw new Error(`Missing loader token: ${token}`);
          console.log('v4.8 economy logistics contract OK');
          NODE
