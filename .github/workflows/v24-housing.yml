name: Validate WorldForge v2.4 Housing

on:
  push:
    branches: ["main"]
    paths:
      - "src/features/households/**"
      - "src/features/housing/**"
      - "tests/features/households.mjs"
      - "tests/features/housing.mjs"
      - ".github/workflows/v24-housing.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/features/households/**"
      - "src/features/housing/**"
      - "tests/features/households.mjs"
      - "tests/features/housing.mjs"
      - ".github/workflows/v24-housing.yml"

permissions:
  contents: read

concurrency:
  group: v24-housing-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-v24:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check v2.3 and v2.4 JavaScript syntax
        run: |
          node --check src/features/households/household-engine.js
          node --check src/features/households/household-wiki-adapter.js
          node --check src/features/households/household-loader.js
          node --check src/features/households/household-ui.js
          node --check src/features/housing/housing-engine.js
          node --check src/features/housing/housing-wiki-adapter.js
          node --check src/features/housing/housing-loader.js
          node --check src/features/housing/housing-ui.js
          node --check tests/features/households.mjs
          node --check tests/features/housing.mjs
      - name: Validate v2.4 runtime files and optimization hooks
        run: |
          test -f src/features/housing/housing-engine.js
          test -f src/features/housing/housing-wiki-adapter.js
          test -f src/features/housing/housing-loader.js
          test -f src/features/housing/housing-ui.js
          test -f src/features/housing/housing.css
          grep -q "WorldForgeHousing" src/features/housing/housing-engine.js
          grep -q "Aristocratic Estates" src/features/housing/housing-engine.js
          grep -q "constructionDemand" src/features/housing/housing-engine.js
          grep -q "overcrowdingRate" src/features/housing/housing-engine.js
          grep -q "src/features/housing/housing-loader.js" src/features/households/household-loader.js
          grep -q "new WeakMap" src/features/households/household-engine.js
          grep -q "runtimeIndexes" src/features/households/household-engine.js
          grep -q "requestAnimationFrame" src/features/households/household-ui.js
          grep -q "requestAnimationFrame" src/features/housing/housing-ui.js
      - name: Run v2.3 household regression after optimization
        run: node tests/features/households.mjs
      - name: Run v2.4 housing land urban development and optimization regression
        run: node tests/features/housing.mjs
