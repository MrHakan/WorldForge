name: Deploy WorldForge to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: validate-${{ github.workflow }}-${{ github.ref }}-${{ matrix.suite }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        suite: [core, features, rendering, warfare]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check all JavaScript syntax
        if: matrix.suite == 'core'
        run: node tests/check-js-syntax.mjs
      - name: Run deterministic and lifecycle regressions
        run: node scripts/test.mjs ${{ matrix.suite }}
        env:
          TEST_CONCURRENCY: '2'

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build runtime-only Pages artifact
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test real browser under the repository subpath
        run: npm run test:browser
      - name: Verify atlas interaction and visual layout
        run: npm run test:atlas
      - name: Record generated atlas review images
        if: always()
        run: node scripts/print-visual-review.mjs
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: worldforge-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Publish the validated version once
        run: node scripts/release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
