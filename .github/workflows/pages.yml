name: Deploy WorldForge to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check engine.js
          node --check history-engine.js
          node --check society-engine.js
          node --check city-engine.js
          node --check adventure-engine.js
          node --check renderer.js
          node --check city-ui.js
          node --check worldforge-extensions.js
          node --check app.js
          node --check tests/worldgen.mjs
          node --check tests/history.mjs
          node --check tests/society.mjs
          node --check tests/cities.mjs
          node --check tests/adventure.mjs
      - name: Validate v0.5 static app
        run: |
          test -f index.html
          test -f adventure-engine.js
          test -f worldforge-extensions.js
          test -f extension.css
          grep -q "v0.5 · ADVENTURE" index.html
          grep -q "adventure-engine.js" index.html
          grep -q "worldforge-extensions.js" index.html
          grep -q "Ruins, Dungeons & Expeditions" worldforge-extensions.js
          grep -q "Boss Chamber" adventure-engine.js
          grep -q "site_discovered" adventure-engine.js
      - name: Run v0.1 deterministic world-generation tests
        run: node tests/worldgen.mjs
      - name: Run v0.2 deterministic history regression tests
        run: node tests/history.mjs
      - name: Run v0.3 deterministic society regression tests
        run: node tests/society.mjs
      - name: Run v0.4 deterministic cities and crime regression tests
        run: node tests/cities.mjs
      - name: Run v0.5 deterministic adventure regression tests
        run: node tests/adventure.mjs

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4