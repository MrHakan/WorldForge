name: Deploy WorldForge to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check engine.js
          node --check history-engine.js
          node --check society-engine.js
          node --check renderer.js
          node --check app.js
          node --check tests/worldgen.mjs
          node --check tests/history.mjs
          node --check tests/society.mjs

      - name: Validate v0.3 static app
        run: |
          test -f index.html
          test -f styles.css
          test -f history.css
          test -f society.css
          test -f engine.js
          test -f history-engine.js
          test -f society-engine.js
          test -f renderer.js
          test -f app.js
          grep -q "v0.3 · SOCIETY" index.html
          grep -q "People, Houses & Succession" index.html
          grep -q "Rulers, Heirs & Claims" index.html
          grep -q "familyGraph" society-engine.js
          grep -q "succession_crisis" society-engine.js
          grep -q "WorldForgeSociety" app.js

      - name: Run v0.1 deterministic world-generation tests
        run: node tests/worldgen.mjs

      - name: Run v0.2 deterministic history regression tests
        run: node tests/history.mjs

      - name: Run v0.3 deterministic society regression tests
        run: node tests/society.mjs

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4