name: Deploy WorldForge to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check engine.js
          node --check history-engine.js
          node --check renderer.js
          node --check app.js
          node --check tests/worldgen.mjs
          node --check tests/history.mjs

      - name: Validate v0.2 static app
        run: |
          test -f index.html
          test -f styles.css
          test -f history.css
          test -f engine.js
          test -f history-engine.js
          test -f renderer.js
          test -f app.js
          grep -q "v0.2 · HISTORY" index.html
          grep -q "Chronicle Simulation" index.html
          grep -q "timelineSlider" index.html
          grep -q "Population" index.html
          grep -q "Prosperity" index.html
          grep -q "Trade" index.html
          grep -q "simulateYears" history-engine.js
          grep -q "viewAt" history-engine.js
          grep -q "historyFingerprint" history-engine.js
          grep -q "realm_formed" history-engine.js
          grep -q "conquest" history-engine.js
          grep -q "setHistoryView" renderer.js

      - name: Run v0.1 deterministic world-generation tests
        run: node tests/worldgen.mjs

      - name: Run v0.2 deterministic history regression tests
        run: node tests/history.mjs

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4