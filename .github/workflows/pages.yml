name: Deploy WorldForge to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check engine.js
          node --check history-engine.js
          node --check society-engine.js
          node --check city-engine.js
          node --check adventure-engine.js
          node --check story-engine.js
          node --check wiki-engine.js
          node --check culture-engine.js
          node --check faction-engine.js
          node --check endless-engine.js
          node --check creator-suite-engine.js
          node --check canon-bridge-engine.js
          node --check canon-wiki-adapter.js
          node --check living-wiki-engine.js
          node --check chronicle-press-engine.js
          node --check knowledge-engine.js
          node --check knowledge-wiki-adapter.js
          node --check calendar-engine.js
          node --check artifact-engine.js
          node --check artifact-wiki-adapter.js
          node --check artifact-loader.js
          node --check technology-engine.js
          node --check technology-wiki-adapter.js
          node --check technology-loader.js
          node --check resource-engine.js
          node --check resource-calibration.js
          node --check resource-wiki-adapter.js
          node --check resource-loader.js
          node --check institution-engine.js
          node --check institution-wiki-adapter.js
          node --check institution-loader.js
          node --check renderer.js
          node --check city-ui.js
          node --check worldforge-v1-ui.js
          node --check culture-ui.js
          node --check faction-ui.js
          node --check endless-ui.js
          node --check release-integration.js
          node --check release-ui.js
          node --check creator-suite-ui.js
          node --check canon-bridge-ui.js
          node --check living-wiki-ui.js
          node --check chronicle-press-ui.js
          node --check knowledge-ui.js
          node --check calendar-ui.js
          node --check artifact-ui.js
          node --check technology-ui.js
          node --check resource-ui.js
          node --check institution-ui.js
          node --check app.js
          node --check tests/worldgen.mjs
          node --check tests/history.mjs
          node --check tests/society.mjs
          node --check tests/cities.mjs
          node --check tests/adventure.mjs
          node --check tests/story.mjs
          node --check tests/wiki.mjs
          node --check tests/culture.mjs
          node --check tests/factions.mjs
          node --check tests/endless.mjs
          node --check tests/creator-suite.mjs
          node --check tests/canon-bridge.mjs
          node --check tests/living-wiki.mjs
          node --check tests/chronicle-press.mjs
          node --check tests/knowledge.mjs
          node --check tests/calendar.mjs
          node --check tests/artifacts.mjs
          node --check tests/technology.mjs
          node --check tests/resources.mjs
          node --check tests/institutions.mjs
      - name: Validate v1.9 Institutions Industry and Great Works static app
        run: |
          test -f index.html
          test -f resource-engine.js
          test -f institution-engine.js
          test -f institution-wiki-adapter.js
          test -f institution-loader.js
          test -f institution-ui.js
          test -f institution.css
          grep -q "WorldForgeInstitutions" institution-engine.js
          grep -q "great_library" institution-engine.js
          grep -q "great_work_completed" institution-engine.js
          grep -q "knowledgeLoss" institution-engine.js
          grep -q "The Civic Foundry" institution-ui.js
          grep -q "Export Civic Ledger" institution-ui.js
          grep -q "WorldForgeInstitutionWiki" institution-wiki-adapter.js
          grep -q "WorldForgeResources" institution-loader.js
          grep -q "resource-loader.js" .github/workflows/pages.yml
          grep -q "institution-loader.js" .github/workflows/pages.yml
          ! grep -q 'id="targetYearInput"[^>]*max="5000"' index.html
      - name: Run v0.1 deterministic world-generation tests
        run: node tests/worldgen.mjs
      - name: Run v0.2 deterministic history regression tests
        run: node tests/history.mjs
      - name: Run v0.3 deterministic society regression tests
        run: node tests/society.mjs
      - name: Run v0.4 deterministic cities and crime regression tests
        run: node tests/cities.mjs
      - name: Run v0.5 deterministic adventure regression tests
        run: node tests/adventure.mjs
      - name: Run v0.6 deterministic story regression tests
        run: node tests/story.mjs
      - name: Run encyclopedia compatibility tests
        run: node tests/wiki.mjs
      - name: Run v0.7 deterministic culture and religion tests
        run: node tests/culture.mjs
      - name: Run v0.8 deterministic faction and organization tests
        run: node tests/factions.mjs
      - name: Run v0.9 endless simulation and compaction tests
        run: node tests/endless.mjs
      - name: Run v1.0 creator toolkit integration tests
        run: node tests/creator-suite.mjs
      - name: Run v1.1 bidirectional canon bridge tests
        run: node tests/canon-bridge.mjs
      - name: Run v1.2 adaptive Living Wiki tests
        run: node tests/living-wiki.mjs
      - name: Run v1.3 heraldry and chronicle press tests
        run: node tests/chronicle-press.mjs
      - name: Run v1.4 knowledge rumours and lost history tests
        run: node tests/knowledge.mjs
      - name: Run v1.5 calendar seasons weather and celestial tests
        run: node tests/calendar.mjs
      - name: Run v1.6 artifacts books and written works tests
        run: node tests/artifacts.mjs
      - name: Run v1.7 technology inventions and diffusion tests
        run: node tests/technology.mjs
      - name: Run v1.8 resources agriculture and supply chain tests
        run: node tests/resources.mjs
      - name: Run v1.9 institutions industry and great works tests
        run: node tests/institutions.mjs

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble v1.9 runtime entrypoint
        run: |
          python - <<'PY'
          p='index.html'
          s=open(p,encoding='utf-8').read()
          tags=['<script src="artifact-loader.js"></script>\n','<script src="technology-loader.js"></script>\n','<script src="resource-loader.js"></script>\n','<script src="institution-loader.js"></script>\n']
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>')
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4