name: v4.5 Urban Evolution

on:
  push:
    branches: [main, v4.5-living-cities]
    paths:
      - 'urban-evolution-engine.js'
      - 'urban-evolution-pixel-renderer.js'
      - 'urban-ui.js'
      - 'worldbuilding-loader.js'
      - 'V4.5.md'
      - '.github/workflows/v45-urban-evolution.yml'
  pull_request:
    paths:
      - 'urban-evolution-engine.js'
      - 'urban-evolution-pixel-renderer.js'
      - 'urban-ui.js'
      - 'worldbuilding-loader.js'
      - 'V4.5.md'
      - '.github/workflows/v45-urban-evolution.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check urban-evolution-engine.js
          node --check urban-evolution-pixel-renderer.js
          node --check urban-ui.js
          node --check worldbuilding-loader.js
      - name: Contract smoke test
        run: |
          node <<'NODE'
          const fs=require('fs');
          const engine=fs.readFileSync('urban-evolution-engine.js','utf8');
          const pixel=fs.readFileSync('urban-evolution-pixel-renderer.js','utf8');
          const ui=fs.readFileSync('urban-ui.js','utf8');
          const loader=fs.readFileSync('worldbuilding-loader.js','utf8');
          for(const token of ["VERSION='4.5.0'","stable","growing","declining","ruined","rebuilding","wall_expansion","reconstruction","world.urbanEvolution"]){if(!engine.includes(token))throw new Error(`Missing v4.5 engine token: ${token}`)}
          for(const token of ['data-urban-state','data-urban-evolution-overlay','outsideWalls','URBAN_EVOLUTION_VERSION']){if(!pixel.includes(token))throw new Error(`Missing v4.5 pixel token: ${token}`)}
          for(const token of ['LIVING CITY EVOLUTION','urbanEvolutionDistricts','urbanEvolutionProjects']){if(!ui.includes(token))throw new Error(`Missing v4.5 UI token: ${token}`)}
          for(const token of ['urban-evolution-engine.js','urban-evolution-pixel-renderer.js','urban-ui.js','simulateUrbanYear']){if(!loader.includes(token))throw new Error(`Missing v4.5 loader token: ${token}`)}
          console.log('v4.5 urban evolution + pixel + atelier contract OK');
          NODE