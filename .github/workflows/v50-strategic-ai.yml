name: v5.0 Strategic AI

on:
  push:
    branches: [main, v5.0-strategic-ai-core, v5.0-commanders-leadership, v5.0-strategic-reserves, v5.0-campaign-reassessment, v5.0-occupation-resistance, v5.0-strategic-map-overlay, v5.0-strategic-map-controls, v5.0-commander-legacies, v5.0-battlefields-war-scars, v5.0-battlefield-relics, v5.0-simulation-hook-registry, v5.0-commander-wounds-succession, v5.0-reserves-hardening, v5.0-campaign-planning-advanced, v5.0-multi-front-campaigns, v5.0-strategic-theater-command, v5.0-operational-movement]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax check
        run: |
          node --check warfare-hooks.js
          node --check warfare-strategic-ai.js
          node --check warfare-commanders.js
          node --check warfare-commander-chronicle.js
          node --check warfare-commander-legacies.js
          node --check warfare-commander-legacies-ui.js
          node --check warfare-battlefield-history-v2.js
          node --check warfare-battlefield-history-ui.js
          node --check warfare-battlefield-relics.js
          node --check warfare-battlefield-relics-ui.js
          node --check warfare-relic-collections.js
          node --check warfare-strategic-reserves.js
          node --check warfare-strategic-reserves-ui.js
          node --check warfare-theater-command.js
          node --check warfare-operational-movement.js
          node --check warfare-campaign-planning.js
          node --check warfare-campaign-planning-ui.js
          node --check warfare-occupation-policy.js
          node --check warfare-occupation-policy-ui.js
          node --check warfare-strategic-map-overlay.js
          node --check warfare-strategic-map-controls.js
          node --check warfare-strategic-ai-ui.js
          node --check worldbuilding-loader.js
          node --check tests/warfare-commanders-v50.mjs
          node --check tests/warfare-commander-chronicle-v50.mjs
          node --check tests/warfare-strategic-reserves-v50.mjs
          node --check tests/warfare-campaign-planning-v50.mjs
          node --check tests/warfare-multifront-strategic-ai-v50.mjs
          node --check tests/warfare-theater-command-v50.mjs
          node --check tests/warfare-operational-movement-v50.mjs
          node --check tests/warfare-battlefield-history-v50.mjs
          node --check tests/warfare-battlefield-relics.test.js
      - name: Commander lifecycle behavior
        run: node tests/warfare-commanders-v50.mjs
      - name: Commander chronicle behavior
        run: node tests/warfare-commander-chronicle-v50.mjs
      - name: Strategic reserve lifecycle behavior
        run: node tests/warfare-strategic-reserves-v50.mjs
      - name: Multi-front strategic allocation behavior
        run: node tests/warfare-multifront-strategic-ai-v50.mjs
      - name: Strategic theater command behavior
        run: node tests/warfare-theater-command-v50.mjs
      - name: Operational reinforcement movement behavior
        run: node tests/warfare-operational-movement-v50.mjs
      - name: Campaign planning behavior
        run: node tests/warfare-campaign-planning-v50.mjs
      - name: Battlefield history behavior
        run: node tests/warfare-battlefield-history-v50.mjs
      - name: Battlefield relic behavior
        run: node tests/warfare-battlefield-relics.test.js
      - name: Contract smoke test
        run: |
          node <<'NODE'
          const fs=require('fs'),read=x=>fs.readFileSync(x,'utf8');
          const sa=read('warfare-strategic-ai.js'),c=read('warfare-commanders.js'),cc=read('warfare-commander-chronicle.js'),l=read('warfare-commander-legacies.js'),lu=read('warfare-commander-legacies-ui.js'),b=read('warfare-battlefield-history-v2.js'),r=read('warfare-battlefield-relics.js'),rc=read('warfare-relic-collections.js'),sr=read('warfare-strategic-reserves.js'),tc=read('warfare-theater-command.js'),om=read('warfare-operational-movement.js'),cp=read('warfare-campaign-planning.js'),cpu=read('warfare-campaign-planning-ui.js'),ui=read('warfare-strategic-ai-ui.js'),hooks=read('warfare-hooks.js'),loader=read('worldbuilding-loader.js');
          for(const t of ["VERSION='5.0.19'",'usedAttackers','usedDefenders','theaterRole','primaryCampaigns','secondaryCampaigns'])if(!sa.includes(t))throw Error(`strategic-ai:${t}`);
          for(const t of ["VERSION='5.0.7'",'riskProfile','woundHistory','recoveryUntilYear','deathYear','successorOf','lastProcessedBattleCount','commanderBaseCombatPower','commanderAdjustedCombatPower','legacyFor'])if(!c.includes(t))throw Error(t);
          for(const t of ["VERSION='5.0.16'",'battleRecord','careerRecord','fallenCommanderIds','chronicleEvents','namedBattles','commander-chronicle'])if(!cc.includes(t))throw Error(`chronicle:${t}`);
          for(const t of ["VERSION='5.0.8'",'battlefield-monument','commander-statue','memorialEligible','commanderMemorials','heritageStatus'])if(!l.includes(t))throw Error(t);
          for(const t of ['COMMANDER LEGACIES','WOUNDS','FALLEN','SUCCESSION','MEMORIALS'])if(!lu.includes(t))throw Error(t);
          for(const t of ["VERSION='5.0.9a'",'battlefieldHistory','archaeologyEligible','heritageEligible','warfareBattlefields','historicalBattlefields','warScars'])if(!b.includes(t))throw Error(t);
          for(const t of ["VERSION='5.0.10'",'battlefieldRelics','protectedContext','provenance','commanderLinked'])if(!r.includes(t))throw Error(t);
          for(const t of ["VERSION='5.0.11'",'relicCollections','provenanceVerified','applyRelicCollections'])if(!rc.includes(t))throw Error(t);
          for(const t of ["VERSION='5.0.17'",'reconcileAssignments','distanceToFront','request-resolved','reinforcementFulfillment'])if(!sr.includes(t))throw Error(`reserves:${t}`);
          for(const t of ["VERSION='5.0.21'",'PROMOTION_MARGIN','primaryByWar','primary-promoted','reserve-transfer','breakthrough-opened','exploitationFronts'])if(!tc.includes(t))throw Error(`theater-command:${t}`);
          for(const t of ["VERSION='5.0.23'",'operationalProgress','operationalEtaYears','march-attrition','reinforcement-arrived','interception-risk'])if(!om.includes(t))throw Error(`operational:${t}`);
          for(const t of ["VERSION='5.0.20'",'campaignKey','theaterRole','primaryCampaignPlans','secondaryCampaignPlans','front-closed','war-ended'])if(!cp.includes(t))throw Error(`campaign:${t}`);
          for(const t of ['THEATER COMMAND','PROMOTIONS','TRANSFERS','BREAKTHROUGHS','COMMAND SCORE'])if(!cpu.includes(t))throw Error(`campaign-ui:${t}`);
          for(const t of ['theater-command','operational-movement',"VERSION='5.0.23'"])if(!hooks.includes(t))throw Error(`hooks:${t}`);
          for(const t of ['warfare-theater-command.js','warfare-operational-movement.js',"WorldForgeWarfareOperationalMovement?.VERSION==='5.0.23'",'WorldForgeWarfareHooks.activate()'])if(!loader.includes(t))throw Error(`loader:${t}`);
          for(const t of ['warfare-commander-chronicle.js','COMMANDER CHRONICLE','NAMED BATTLES','CHRONICLE'])if(!ui.includes(t))throw Error(`ui:${t}`);
          console.log('v5.0 operational movement + strategic theater contracts OK');
          NODE
