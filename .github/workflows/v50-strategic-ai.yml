name: v5.0 Strategic AI

on:
  push:
    branches: [main, v5.0-strategic-ai-core, v5.0-commanders-leadership, v5.0-strategic-reserves, v5.0-campaign-reassessment, v5.0-occupation-resistance]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax check
        run: |
          node --check warfare-strategic-ai.js
          node --check warfare-commanders.js
          node --check warfare-strategic-reserves.js
          node --check warfare-strategic-reserves-ui.js
          node --check warfare-campaign-planning.js
          node --check warfare-campaign-planning-ui.js
          node --check warfare-occupation-policy.js
          node --check warfare-occupation-policy-ui.js
          node --check warfare-strategic-ai-ui.js
          node --check worldbuilding-loader.js
      - name: Contract smoke test
        run: |
          node <<'NODE'
          const fs=require('fs'),read=x=>fs.readFileSync(x,'utf8');
          const ai=read('warfare-strategic-ai.js'),cmd=read('warfare-commanders.js'),res=read('warfare-strategic-reserves.js'),plan=read('warfare-campaign-planning.js'),occ=read('warfare-occupation-policy.js'),occUi=read('warfare-occupation-policy-ui.js'),ui=read('warfare-strategic-ai-ui.js');
          for(const t of ["VERSION='5.0.0'",'buildFront','occupationRows','STRATEGIC_AI_VERSION'])if(!ai.includes(t))throw Error(t);
          for(const t of ["VERSION='5.0.1'",'TRAITS','commandModifier','COMMANDERS_VERSION'])if(!cmd.includes(t))throw Error(t);
          for(const t of ["VERSION='5.0.2'",'collapseRisk','reinforcementPriority','STRATEGIC_RESERVES_VERSION'])if(!res.includes(t))throw Error(t);
          for(const t of ["VERSION='5.0.3'",'momentum','reassessObjective','CAMPAIGN_PLANNING_VERSION'])if(!plan.includes(t))throw Error(t);
          for(const t of ["VERSION='5.0.4'",'POLICIES','military-rule','conciliatory','collaboration','extraction','liberationRisk','OCCUPATION_POLICY_VERSION'])if(!occ.includes(t))throw Error(t);
          for(const t of ['OCCUPATION & RESISTANCE','COLLABORATION','LIBERATION RISK','HIGH RESISTANCE'])if(!occUi.includes(t))throw Error(t);
          for(const t of ['warfare-occupation-policy.js','warfare-occupation-policy-ui.js','applyOccupationPolicy'])if(!ui.includes(t))throw Error(t);
          console.log('v5.0 strategic stack contract OK');
          NODE
