name: v5.0 Strategic AI

on:
  push:
    branches: [main, v5.0-strategic-ai-core, v5.0-commanders-leadership, v5.0-strategic-reserves, v5.0-campaign-reassessment, v5.0-occupation-resistance, v5.0-strategic-map-overlay, v5.0-strategic-map-controls]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax check
        run: |
          node --check warfare-strategic-ai.js
          node --check warfare-commanders.js
          node --check warfare-strategic-reserves.js
          node --check warfare-strategic-reserves-ui.js
          node --check warfare-campaign-planning.js
          node --check warfare-campaign-planning-ui.js
          node --check warfare-occupation-policy.js
          node --check warfare-occupation-policy-ui.js
          node --check warfare-strategic-map-overlay.js
          node --check warfare-strategic-map-controls.js
          node --check warfare-strategic-ai-ui.js
          node --check worldbuilding-loader.js
      - name: Contract smoke test
        run: |
          node <<'NODE'
          const fs=require('fs'),read=x=>fs.readFileSync(x,'utf8');
          const map=read('warfare-strategic-map-overlay.js'),controls=read('warfare-strategic-map-controls.js'),ui=read('warfare-strategic-ai-ui.js');
          for(const t of ["VERSION='5.0.6'",'layers:{fronts:true,campaigns:true,reinforcements:true,occupations:true}','toggleLayer','selectFront','selectCampaign','clearSelection','data-selected'])if(!map.includes(t))throw Error(t);
          for(const t of ['STRATEGIC MAP','Fronts','Campaigns','Reinforcements','Occupations','aria-pressed','Clear'])if(!controls.includes(t))throw Error(t);
          for(const t of ['warfare-strategic-map-controls.js','data-campaign-id','data-front-id','selectCampaign','selectFront','5.0.6'])if(!ui.includes(t))throw Error(t);
          console.log('v5.0 strategic map controls contract OK');
          NODE
