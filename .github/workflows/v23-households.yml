name: Validate WorldForge v2.3 Households

on:
  push:
    branches: ["main"]
    paths:
      - 'src/features/households/**'
      - 'src/features/workforce/workforce-loader.js'
      - 'tests/features/households.mjs'
      - '.github/workflows/v23-households.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'src/features/households/**'
      - 'src/features/workforce/workforce-loader.js'
      - 'tests/features/households.mjs'
      - '.github/workflows/v23-households.yml'

permissions:
  contents: read

concurrency:
  group: v23-households-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-v23:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check v2.3 JavaScript syntax
        run: |
          node --check src/features/households/household-engine.js
          node --check src/features/households/household-wiki-adapter.js
          node --check src/features/households/household-loader.js
          node --check src/features/households/household-ui.js
          node --check src/features/workforce/workforce-loader.js
          node --check tests/features/households.mjs
      - name: Validate v2.3 runtime files
        run: |
          test -f src/features/households/household-engine.js
          test -f src/features/households/household-wiki-adapter.js
          test -f src/features/households/household-loader.js
          test -f src/features/households/household-ui.js
          test -f src/features/households/household.css
          grep -q "WorldForgeHouseholds" src/features/households/household-engine.js
          grep -q "Landless Poor" src/features/households/household-engine.js
          grep -q "aristocracy" src/features/households/household-engine.js
          grep -q "educationIndex" src/features/households/household-engine.js
          grep -q "lifeExpectancy" src/features/households/household-engine.js
          grep -q "src/features/households/household-loader.js" src/features/workforce/workforce-loader.js
      - name: Run v2.3 household social class and demography regression
        run: node tests/features/households.mjs
