name: Validate WorldForge v2.3 Households

on:
  push:
    branches: ["main", "v2.3-households-demography"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate-v23:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check v2.3 JavaScript syntax
        run: |
          node --check household-engine.js
          node --check household-wiki-adapter.js
          node --check household-loader.js
          node --check household-ui.js
          node --check workforce-loader.js
          node --check tests/households.mjs
      - name: Validate v2.3 runtime files
        run: |
          test -f household-engine.js
          test -f household-wiki-adapter.js
          test -f household-loader.js
          test -f household-ui.js
          test -f household.css
          grep -q "WorldForgeHouseholds" household-engine.js
          grep -q "Landless Poor" household-engine.js
          grep -q "aristocracy" household-engine.js
          grep -q "educationIndex" household-engine.js
          grep -q "lifeExpectancy" household-engine.js
          grep -q "household-loader.js" workforce-loader.js
      - name: Run v2.3 household social class and demography regression
        run: node tests/households.mjs
